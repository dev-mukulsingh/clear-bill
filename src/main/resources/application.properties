# Default application configuration (Production profile uses MySQL/MariaDB)
spring.application.name=clearbillsolutions
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server configuration
server.port=${PORT:8080}

# MySQL / MariaDB Production Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/clearbill_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# File upload limits (for company logo upload)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Thymeleaf Configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=true
