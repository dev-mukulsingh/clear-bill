# Development Profile Configuration (H2 in-memory database)
spring.datasource.url=jdbc:h2:mem:clearbilldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# Execute schema.sql and data.sql on startup
spring.sql.init.mode=always

# Thymeleaf cache disabled for live template development
spring.thymeleaf.cache=false
